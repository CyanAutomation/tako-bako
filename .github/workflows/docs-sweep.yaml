name: Kaseki Docs Sweep

on:
  workflow_dispatch:

run-name: >-
  Docs sweep · ${{ github.repository }}@main

permissions: {}

concurrency:
  group: kaseki-docs-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Submit Kaseki documentation sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this environment with required reviewers, a main-only branch rule,
    # KASEKI_API_TOKEN as an environment secret, and KASEKI_BASE_URL as a variable.
    environment: kaseki-docs
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REF: main
      ALLOWLIST: README.md,docs/**/*.md
      VALIDATION_COMMAND: npm run check

    steps:
      - name: Check Kaseki availability
        run: |
          set -euo pipefail
          if [[ -z "${KASEKI_BASE_URL:-}" ]]; then
            echo "::error title=Missing Kaseki URL::KASEKI_BASE_URL is not configured for the kaseki-docs environment"
            exit 1
          fi
          if [[ ! "$KASEKI_BASE_URL" =~ ^https://[^/]+(/.*)?$ ]]; then
            echo "::error title=Invalid Kaseki URL::KASEKI_BASE_URL must be an HTTPS URL"
            exit 1
          fi
          KASEKI_BASE_URL="${KASEKI_BASE_URL%/}"
          curl --fail --silent --show-error --max-time 20 \
            "$KASEKI_BASE_URL/ready"

      - name: Submit documentation sweep
        id: submit
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                taskMode: "patch",
                timeoutSeconds: 10800,
                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),
                validationCommands: (
                  if $validationCommand == "" then []
                  else [$validationCommand]
                  end
                ),
                goalCheck: {
                  enabled: true,
                  maxRetries: 1
                },
                taskPrompt: (
                  "Perform the documentation sweep for this repository. "
                  + "First read repository instructions, then inspect the current "
                  + "implementation and compare it against README.md and documentation "
                  + "under docs/. Update documentation only where inaccurate, incomplete, "
                  + "or stale. Do not modify application code, tests, configuration, "
                  + "dependencies, lockfiles, CI workflows, or generated files. "
                  + "Do not invent behavior. Avoid cosmetic rewrites. Before finishing, "
                  + "review the diff to confirm it contains documentation-only changes. "
                  + "If documentation is already accurate, make no changes and do not "
                  + "open a pull request."
                )
              }'
          )"
          
          response_file="$(mktemp)"

          http_status="$(
            curl --silent --show-error \
              --retry 3 --retry-all-errors --max-time 60 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$KASEKI_BASE_URL/api/runs" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload"
          )"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"
            echo "Kaseki response (HTTP $http_status):"
            cat "$response_file"

            {
              echo "## Kaseki submission failed"
              echo
              echo "Kaseki returned HTTP \`$http_status\`."
              echo
              echo "### Response"
              echo '```json'
              jq . "$response_file" 2>/dev/null || cat "$response_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          response="$(<"$response_file")"
          echo "$response" | jq .
          run_id="$(echo "$response" | jq -er '.id')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Publish submission details
        run: |
          {
            echo "## Kaseki submission"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Mode | \`patch\` |"
            echo "| Timeout | 3 hours |"
            echo "| Kaseki run | \`${{ steps.submit.outputs.run_id }}\` |"
            echo
            echo "### Allowed paths"
            echo '```text'
            echo "$ALLOWLIST" | tr ',' '\n'
            echo '```'
            echo
            echo "### Validation"
            echo '```text'
            echo "${VALIDATION_COMMAND:-No validation command configured}"
            echo '```'
            echo
            echo "Monitor the run: $KASEKI_BASE_URL/ui"
          } >> "$GITHUB_STEP_SUMMARY"
