name: Kaseki Docs Sweep

on:
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

run-name: >-
  Docs sweep · ${{ github.repository }}@main

permissions:
  contents: read

concurrency:
  group: kaseki-${{ github.repository }}
  cancel-in-progress: false

env:
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}
  REF: main
  KASEKI_PUBLISH_MODE: pr
  KASEKI_MAX_DIFF_BYTES: "102400"
  TASK_DESCRIPTION: Keep README.md and docs/ accurate against the current implementation.
  ALLOWLIST: README.md,docs/**/*.md
  VALIDATION_COMMAND: npm run lint && npm test && npm run build

jobs:
  docs_sweep:
    name: Run Kaseki documentation sweep
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    environment: kaseki-agent
    env:
      # Do not add a public fallback URL.
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Verify Kaseki controller and gateway
        uses: $/.github/actions/kaseki-preflight
        with:
          base-url: ${{ vars.KASEKI_BASE_URL }}
          api-token: ${{ secrets.KASEKI_API_TOKEN }}

      - name: Create idempotency key
        id: idempotency
        shell: bash
        run: |
          set -euo pipefail

          key="$(node scripts/kaseki/idempotency-key.mjs)"

          [[ "$key" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-5[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Submit documentation sweep
        id: submit
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
          IDEMPOTENCY_KEY: ${{ steps.idempotency.outputs.key }}
        run: |
          set -euo pipefail

          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"
          : "${IDEMPOTENCY_KEY:?idempotency key was not created}"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg publishMode "$KASEKI_PUBLISH_MODE" \
              --argjson maxDiffBytes "$KASEKI_MAX_DIFF_BYTES" \
              --arg idempotencyKey "$IDEMPOTENCY_KEY" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                idempotencyKey: $idempotencyKey,
                taskMode: "patch",
                publishMode: $publishMode,
                timeoutSeconds: 10800,
                maxDiffBytes: $maxDiffBytes,

                scouting: {
                  enabled: false
                },

                goalSetting: {
                  enabled: false
                },

                goalCheck: {
                  enabled: false
                },

                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),

                validationCommands: (
                  if $validationCommand == "" then
                    []
                  else
                    [$validationCommand]
                  end
                ),

                taskPrompt: (
                  $taskDescription
                  + "\n\nPerform the documentation sweep for this repository. "
                  + "First read repository instructions, then inspect the current "
                  + "implementation and compare it against README.md and documentation "
                  + "under docs/. Update documentation only where inaccurate, incomplete, "
                  + "or stale. Do not modify application code, tests, configuration, "
                  + "dependencies, lockfiles, CI workflows, or generated files. "
                  + "Do not invent behavior. Avoid cosmetic rewrites. Before finishing, "
                  + "review the diff to confirm it contains documentation-only changes. "
                  + "If documentation is already accurate, make no changes and do not "
                  + "open a pull request."
                )
              }'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            timeout --foreground --kill-after=5s 300s \
              curl --silent --show-error \
                --retry 3 --retry-all-errors \
                --connect-timeout 10 --max-time 60 \
                --max-filesize 1048576 \
                --proto '=https' --tlsv1.2 \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --request POST "$KASEKI_BASE_URL/api/runs" \
                --header "Authorization: Bearer $KASEKI_API_TOKEN" \
                --header "Content-Type: application/json" \
                --data "$payload"
          )"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"
            exit 1
          fi

          run_id="$(
            jq -er \
              '.id | strings | select(test("^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"))' \
              "$response_file"
          )"

          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Kaseki completion
        id: wait
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
          RUN_ID: ${{ steps.submit.outputs.run_id }}
        run: |
          set -euo pipefail
          node scripts/kaseki/wait-for-run.mjs

      - name: Publish run details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          FINAL_STATUS: ${{ steps.wait.outputs.status || 'not completed' }}
        run: |
          {
            echo "## Kaseki Docs sweep"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | $REPO_URL |"
            echo "| Ref | $REF |"
            echo "| Publish mode | normal full pull request |"
            echo "| Timeout | 3 hours, with 185 minute status polling limit |"
            echo "| Maximum diff | 100 KiB |"
            echo "| Kaseki run | $RUN_ID |"
            echo "| Final status | $FINAL_STATUS |"
            echo
            echo "Allowed paths: $ALLOWLIST"
            echo "Validation: $VALIDATION_COMMAND"
            echo "Monitor the run: $KASEKI_BASE_URL/ui"
          } >> "$GITHUB_STEP_SUMMARY"
