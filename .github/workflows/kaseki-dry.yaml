name: Kaseki DRY Sweep

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

run-name: >-
  DRY sweep · ${{ github.repository }}@main

permissions: {}

# Keep Kaseki runs serialized across both sweep workflows.
concurrency:
  group: kaseki-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dry_sweep:
    name: Run Kaseki DRY sweep
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 200

    # Configure KASEKI_API_TOKEN as a secret and KASEKI_BASE_URL as an
    # environment variable.
    environment: kaseki-agent

    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}

      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REF: main

      TASK_DESCRIPTION: >-
        Perform a conservative DRY-principle review of this repository.

      # Adjust these paths for each repository.
      ALLOWLIST: src/**/*,api/**/*,scripts/**/*,test/**/*,tests/**/*

      VALIDATION_COMMAND: npm run check

    steps:
      - name: Validate Kaseki configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${KASEKI_BASE_URL:?Configure KASEKI_BASE_URL as an environment variable}"

          if [[ "$KASEKI_BASE_URL" != "https://kaseki-tunnel.scheimann.xyz" ]]; then
            echo "::error title=Invalid Kaseki controller URL::Use the approved HTTPS controller URL."
            exit 1
          fi

          for tool in curl jq node timeout; do
            command -v "$tool" >/dev/null || {
              echo "::error title=Missing required tool::Required command '$tool' is unavailable."
              exit 1
            }
          done

      - name: Verify controller health
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            --max-filesize 1048576 \
            --proto '=https' --tlsv1.2 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/health"

          jq -e '.status == "healthy"' "$response_file" >/dev/null
          echo "Kaseki health check succeeded."

      - name: Verify controller readiness
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            --max-filesize 1048576 \
            --proto '=https' --tlsv1.2 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/ready"

          jq -e '.status == "ready"' "$response_file" >/dev/null
          echo "Kaseki readiness check succeeded."

      - name: Verify gateway connectivity and authentication
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --max-filesize 1048576 \
            --proto '=https' --tlsv1.2 \
            --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_BASE_URL/api/gateway-test?stage=1"

          jq -e '.status == "ok"' "$response_file" >/dev/null
          echo "Kaseki gateway authentication succeeded."

      - name: Create idempotency key
        id: idempotency
        shell: bash
        run: |
          set -euo pipefail

          key="$(node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";

          const namespace = Buffer.from("6ba7b8119dad11d180b400c04fd430c8", "hex");
          const name = JSON.stringify([
            process.env.GITHUB_REPOSITORY,
            process.env.GITHUB_WORKFLOW,
            process.env.GITHUB_RUN_ID,
          ]);
          const digest = createHash("sha1").update(namespace).update(name).digest();
          digest[6] = (digest[6] & 0x0f) | 0x50;
          digest[8] = (digest[8] & 0x3f) | 0x80;

          const hex = digest.subarray(0, 16).toString("hex");
          console.log([
            hex.slice(0, 8),
            hex.slice(8, 12),
            hex.slice(12, 16),
            hex.slice(16, 20),
            hex.slice(20),
          ].join("-"));
          NODE
          )"

          [[ "$key" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-5[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Submit DRY sweep
        id: submit
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
          IDEMPOTENCY_KEY: ${{ steps.idempotency.outputs.key }}
        run: |
          set -euo pipefail

          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"
          : "${IDEMPOTENCY_KEY:?idempotency key was not created}"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$IDEMPOTENCY_KEY" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                taskMode: "patch",
                publishMode: "pr",
                timeoutSeconds: 10800,
                idempotencyKey: $idempotencyKey,
                maxDiffBytes: 102400,

                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),

                validationCommands: [$validationCommand],

                goalCheck: {
                  enabled: true,
                  maxRetries: 1
                },

                taskPrompt: (
                  $taskDescription
                  + "\n\nLook for duplicated knowledge rather than merely duplicated text. "
                  + "Strong candidates include repeated business rules, validation rules, "
                  + "constants, configuration knowledge, parsing or normalisation logic, "
                  + "transformations, and substantially identical implementations that "
                  + "must remain synchronised. "
                  + "\n\nDo not assume that all repetition violates DRY. Similar-looking "
                  + "code may represent separate concepts or may need to evolve independently. "
                  + "Prefer clear duplication over an abstraction that increases coupling, "
                  + "indirection, or cognitive load. "
                  + "\n\nIdentify the single strongest DRY improvement available. Only act "
                  + "when the duplication represents the same underlying knowledge and "
                  + "consolidation has a clear maintenance benefit. "
                  + "\n\nPrefer reusing an existing abstraction. If a new abstraction is "
                  + "justified, keep it at the narrowest sensible scope. "
                  + "\n\nMake at most one focused refactoring. "
                  + "\n\nA no-change result is successful. If there is no sufficiently "
                  + "valuable, high-confidence DRY improvement, make no changes."
                )
              }'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            timeout --foreground --kill-after=5s 300s \
              curl --silent --show-error \
                --retry 3 --retry-all-errors \
                --connect-timeout 10 --max-time 60 \
                --max-filesize 1048576 \
                --proto '=https' --tlsv1.2 \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --request POST "$KASEKI_BASE_URL/api/runs" \
                --header "Authorization: Bearer $KASEKI_API_TOKEN" \
                --header "Content-Type: application/json" \
                --data "$payload"
          )"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"
            exit 1
          fi

          run_id="$(
            jq -er \
              '.id | strings | select(test("^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"))' \
              "$response_file"
          )"

          echo "submitted_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          echo "Kaseki DRY sweep submitted."

      - name: Wait for Kaseki completion
        id: wait
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
          RUN_ID: ${{ steps.submit.outputs.run_id }}
          SUBMITTED_AT: ${{ steps.submit.outputs.submitted_at }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          # Kaseki allows three hours; stop polling after 185 minutes.
          deadline=$((SUBMITTED_AT + 185 * 60))
          while (( $(date +%s) < deadline )); do
            timeout --foreground --kill-after=5s 50s \
              curl --fail-with-body --silent --show-error \
                --retry 2 --retry-all-errors \
                --connect-timeout 10 --max-time 40 \
                --max-filesize 1048576 \
                --proto '=https' --tlsv1.2 \
                --output "$response_file" \
                --header "Authorization: Bearer $KASEKI_API_TOKEN" \
                "$KASEKI_BASE_URL/api/runs/$RUN_ID/status"

            status="$(jq -er '.status | strings' "$response_file")"

            case "$status" in
              completed)
                exit_code="$(jq -er '.exitCode // 0 | numbers' "$response_file")"
                if (( exit_code != 0 )); then
                  echo "status=failed" >> "$GITHUB_OUTPUT"
                  echo "::error title=Kaseki run failed::Completed with exit code $exit_code"
                  exit 1
                fi
                echo "status=completed" >> "$GITHUB_OUTPUT"
                echo "Kaseki status: completed with exit code $exit_code"
                exit 0
                ;;

              failed|cancelled)
                echo "status=$status" >> "$GITHUB_OUTPUT"
                echo "::error title=Kaseki run failed::Kaseki status: $status"
                exit 1
                ;;

              queued|running)
                echo "Kaseki status: $status"
                if (( $(date +%s) < deadline )); then
                  sleep 60
                fi
                ;;

              *)
                echo "::error title=Unexpected Kaseki status::Controller returned an unsupported status"
                exit 1
                ;;
            esac
          done

          echo "::error title=Kaseki run timed out::No terminal status within 185 minutes of submission"
          exit 1

      - name: Publish run details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          FINAL_STATUS: ${{ steps.wait.outputs.status || 'not completed' }}
        run: |
          {
            echo "## Kaseki DRY sweep"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | $REPO_URL |"
            echo "| Ref | $REF |"
            echo "| Publish mode | normal full pull request |"
            echo "| Maximum diff | 100 KiB |"
            echo "| Allowed paths | $ALLOWLIST |"
            echo "| Validation | $VALIDATION_COMMAND |"
            echo "| Maximum refactorings | 1 |"
            echo "| Kaseki run | $RUN_ID |"
            echo "| Final status | $FINAL_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"
